<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>AI 語音待辦提醒系統</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">✓</div>
      <div><p class="eyebrow">VOICE TASK REMINDER</p><h1>AI 語音待辦提醒系統</h1></div>
    </header>

    <section class="composer card" aria-labelledby="composer-title">
      <h2 id="composer-title">新增一項待辦</h2>
      <form id="task-form">
        <label class="sr-only" for="task-input">任務內容</label>
        <textarea id="task-input" rows="2" placeholder="請輸入待辦事項" required></textarea>
        <div id="speech-notice" class="speech-notice" role="status" aria-live="polite" hidden></div>
        <div class="composer-actions">
          <button type="button" id="voice-button" class="button button-voice">🎙️ <span>語音輸入</span></button>
          <button type="submit" class="button button-primary">新增任務</button>
        </div>
        <p class="input-hint">例如：明天早上八點提醒我買早餐</p>
      </form>
    </section>

    <section class="task-area" aria-label="任務清單">
      <div id="task-groups"></div>
    </section>
    <footer>資料只儲存在這台裝置的瀏覽器中</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
